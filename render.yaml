services:
  # ─── Backend (FastAPI) ────────────────────────────────────
  - type: web
    name: esg-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/social_dashboard.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: false
    disk:
      name: db-data
      mountPath: /app/data
      sizeGB: 1

  # ─── Frontend (Static Site) ──────────────────────────────
  - type: static
    name: esg-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
